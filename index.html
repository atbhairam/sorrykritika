<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Kritika 🌸</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color:#583d4c;

    background:
        radial-gradient(
            circle at 10% 10%,
            #ffdce9,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            #ffeecf,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #fffaff,
            #fff3f8,
            #fffaf1
        );

    transition:
        background .7s ease,
        color .7s ease;
}


/* =========================================================
   DARK MODE
========================================================= */

body.night{

    color:#f9eaf1;

    background:
        radial-gradient(
            circle at 15% 10%,
            #4a2d50,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #15121b,
            #291c2b
        );
}


/* =========================================================
   KRITIKA WALLPAPER
========================================================= */

#kritikaWallpaper{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    pointer-events:none;

    z-index:1;
}


/* Individual words */

.kritikaWord{

    position:absolute;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-weight:bold;

    color:rgba(
        186,
        60,
        112,
        .34
    );

    text-shadow:

        0 0 5px
        rgba(255,120,170,.35),

        0 0 15px
        rgba(255,150,190,.25);

    white-space:nowrap;

    letter-spacing:1px;

    user-select:none;

    animation:
        kritikaMove
        6s
        ease-in-out
        infinite
        alternate;
}


body.night .kritikaWord{

    color:rgba(
        255,
        165,
        205,
        .38
    );

    text-shadow:

        0 0 8px
        rgba(255,120,180,.5),

        0 0 18px
        rgba(255,160,200,.3);
}


@keyframes kritikaMove{

    0%{

        transform:
            translateY(0)
            rotate(-5deg);

        opacity:.30;
    }

    50%{

        opacity:.65;
    }

    100%{

        transform:
            translateY(-25px)
            rotate(5deg);

        opacity:.35;
    }
}


/* =========================================================
   PROGRESS BAR
========================================================= */

#progress{

    position:fixed;

    top:0;
    left:0;

    width:0;
    height:4px;

    background:
        linear-gradient(
            90deg,
            #ed8eaf,
            #a94770
        );

    z-index:1000;
}


/* =========================================================
   NAVBAR
========================================================= */

.nav{

    position:fixed;

    top:15px;
    left:50%;

    transform:
        translateX(-50%);

    width:
        min(
            900px,
            calc(100% - 25px)
        );

    padding:
        11px 18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:
        rgba(255,255,255,.65);

    backdrop-filter:
        blur(20px);

    border:
        1px solid
        rgba(255,255,255,.7);

    border-radius:50px;

    box-shadow:
        0 10px 40px
        rgba(120,50,80,.13);

    z-index:100;
}


body.night .nav{

    background:
        rgba(30,20,35,.75);

    border-color:
        rgba(255,200,220,.15);
}


.brand{

    color:#a94770;

    font-weight:800;

    letter-spacing:.5px;
}


.themeButton{

    border:0;

    background:transparent;

    cursor:pointer;

    font-size:21px;

    transition:.3s;
}


.themeButton:hover{

    transform:
        rotate(25deg)
        scale(1.15);
}


/* =========================================================
   MAIN
========================================================= */

main{

    position:relative;

    z-index:5;
}


section{

    min-height:100vh;

    padding:
        115px 18px 70px;

    display:grid;

    place-items:center;
}


/* =========================================================
   GLASS CARD
========================================================= */

.glass{

    position:relative;

    width:
        min(
            900px,
            100%
        );

    padding:
        50px 30px;

    text-align:center;

    background:
        rgba(255,255,255,.76);

    backdrop-filter:
        blur(18px);

    border:
        1px solid
        rgba(255,185,210,.7);

    border-radius:40px;

    box-shadow:
        0 35px 100px
        rgba(150,65,105,.15);

    overflow:hidden;
}


body.night .glass{

    background:
        rgba(38,27,43,.76);

    border-color:
        rgba(255,200,220,.15);
}


/* =========================================================
   TYPOGRAPHY
========================================================= */

.kicker{

    color:#c05a82;

    font-size:12px;

    font-weight:800;

    letter-spacing:4px;

    text-transform:uppercase;

    margin-bottom:15px;
}


h1,
h2{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color:#a94770;
}


h1{

    font-size:
        clamp(
            58px,
            12vw,
            105px
        );

    line-height:.9;

    margin:
        18px 0 25px;
}


h2{

    font-size:
        clamp(
            40px,
            7vw,
            70px
        );

    margin-bottom:22px;
}


.lead{

    max-width:700px;

    margin:auto;

    font-size:19px;

    line-height:1.8;
}


.muted{

    color:#795f6c;

    line-height:1.8;
}


/* =========================================================
   FLOWERS
========================================================= */

.lilies{

    font-size:45px;

    letter-spacing:8px;

    margin:
        12px 0 8px;

    animation:
        flowerSway
        4s
        ease-in-out
        infinite;
}


@keyframes flowerSway{

    50%{

        transform:
            rotate(2deg)
            scale(1.05);
    }
}


/* =========================================================
   CAT
========================================================= */

.cat{

    font-size:100px;

    display:inline-block;

    cursor:pointer;

    user-select:none;

    animation:
        catFloat
        3s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 15px 10px
            rgba(80,40,60,.15)
        );

    transition:.3s;
}


@keyframes catFloat{

    50%{

        transform:
            translateY(-12px);
    }
}


.cat:hover{

    transform:
        scale(1.1);
}


/* =========================================================
   SCROLL
========================================================= */

.scroll{

    margin-top:35px;

    font-size:11px;

    letter-spacing:3px;

    color:#9c647c;
}


.scroll span{

    display:block;

    font-size:27px;

    margin-top:5px;

    animation:
        down
        1.5s
        infinite;
}


@keyframes down{

    50%{

        transform:
            translateY(8px);
    }
}


/* =========================================================
   REVEAL
========================================================= */

.reveal{

    opacity:0;

    transform:
        translateY(40px);

    transition:
        opacity 1s ease,
        transform 1s
        cubic-bezier(.2,.7,.2,1);
}


.reveal.show{

    opacity:1;

    transform:none;
}


/* =========================================================
   ENVELOPE
========================================================= */

.envelopeArea{

    width:
        min(
            540px,
            100%
        );

    height:330px;

    margin:
        30px auto;

    perspective:1200px;

    cursor:pointer;
}


.envelope{

    width:100%;
    height:100%;

    position:relative;

    transform-style:
        preserve-3d;
}


.envelopeBody{

    position:absolute;

    inset:
        20px 0 0;

    background:#f7d8e5;

    border-radius:18px;

    box-shadow:
        0 25px 50px
        rgba(120,50,80,.16);
}


.flap{

    position:absolute;

    top:20px;
    left:0;

    width:100%;
    height:150px;

    background:#f1c1d4;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:top;

    transition:1s;

    z-index:4;
}


.paper{

    position:absolute;

    left:8%;
    right:8%;

    top:70px;

    height:205px;

    padding:25px;

    background:#fffdf8;

    border-radius:12px;

    z-index:2;

    text-align:left;

    line-height:1.7;

    box-shadow:
        0 8px 25px
        rgba(80,40,50,.12);

    transition:1s;
}


.seal{

    position:absolute;

    top:112px;
    left:50%;

    transform:
        translateX(-50%);

    width:55px;
    height:55px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:#bd587e;

    color:white;

    font-size:20px;

    z-index:6;

    transition:.5s;
}


.envelope.open .flap{

    transform:
        rotateX(180deg);

    z-index:1;
}


.envelope.open .paper{

    transform:
        translateY(-125px);

    z-index:5;
}


.envelope.open .seal{

    opacity:0;

    transform:
        translateX(-50%)
        scale(.3);
}


/* =========================================================
   LETTER
========================================================= */

.letter{

    max-width:760px;

    margin:auto;

    padding:35px;

    text-align:left;

    font-size:18px;

    line-height:1.95;

    background:
        rgba(255,250,253,.88);

    border:
        1px solid
        #f0d1de;

    border-radius:30px;

    box-shadow:
        0 20px 60px
        rgba(150,65,105,.08);
}


body.night .letter{

    background:
        rgba(42,29,46,.8);

    border-color:
        rgba(255,200,220,.12);
}


.letter p{

    margin-bottom:18px;
}


.highlight{

    color:#a94770;

    font-weight:800;
}


.quote{

    padding-top:25px;

    margin-top:25px;

    border-top:
        1px solid
        #efd7e1;

    text-align:center;

    font-family:
        Georgia,
        serif;

    font-size:23px;

    font-style:italic;

    color:#87566d;
}


/* =========================================================
   MEMORY CARDS
========================================================= */

.cards{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

    margin-top:30px;
}


.memory{

    padding:28px;

    text-align:left;

    border-radius:25px;

    background:
        rgba(255,255,255,.6);

    border:
        1px solid
        #efd4df;

    transition:.35s;
}


body.night .memory{

    background:
        rgba(45,30,48,.7);

    border-color:
        rgba(255,200,220,.12);
}


.memory:hover{

    transform:
        translateY(-10px)
        rotate(-1deg);

    box-shadow:
        0 25px 50px
        rgba(150,65,105,.15);
}


.icon{

    font-size:40px;
}


.memory h3{

    color:#a94770;

    margin:
        12px 0;
}


.memory p{

    color:var(--muted);

    line-height:1.7;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:12px;

    margin-top:28px;
}


.btn{

    border:0;

    padding:
        15px 27px;

    border-radius:50px;

    background:#c85d86;

    color:white;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 10px 25px
        rgba(190,80,125,.3);

    transition:.25s;
}


.btn:hover{

    transform:
        translateY(-4px)
        scale(1.03);
}


.btn.alt{

    background:#f4d5e1;

    color:#85445e;
}


.status{

    min-height:30px;

    margin-top:18px;

    color:#a94770;

    font-weight:800;
}


/* =========================================================
   FINAL CARD
========================================================= */

.finalCard{

    width:
        min(
            800px,
            100%
        );

    padding:
        60px 28px;

    text-align:center;

    border-radius:42px;

    background:
        var(--card);

    border:
        1px solid
        #efcfdd;

    box-shadow:
        0 35px 100px
        rgba(150,65,105,.15);
}


.finalHeart{

    font-size:90px;

    animation:
        heartbeat
        1.1s
        infinite;
}


@keyframes heartbeat{

    50%{

        transform:
            scale(1.15);
    }
}


/* =========================================================
   HEARTS
========================================================= */

.heart{

    position:fixed;

    pointer-events:none;

    z-index:900;

    animation:
        heartAnimation
        1.8s
        ease
        forwards;
}


@keyframes heartAnimation{

    0%{

        opacity:0;

        transform:
            translateY(0)
            scale(.4);
    }

    20%{

        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translateY(-180px)
            scale(1.5)
            rotate(25deg);
    }
}


/* =========================================================
   FOOTER
========================================================= */

footer{

    position:relative;

    z-index:5;

    text-align:center;

    padding:25px;

    color:#a4778a;

    font-size:13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .glass{

        padding:
            38px 18px;
    }

    .cat{

        font-size:80px;
    }

    .lilies{

        font-size:31px;

        letter-spacing:4px;
    }

    .letter{

        padding:23px;

        font-size:16px;
    }

    .cards{

        grid-template-columns:1fr;
    }

    .envelopeArea{

        height:280px;
    }

    .paper{

        height:180px;
    }

    .kritikaWord{

        font-size:16px;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     KRITIKA BACKGROUND
========================================================= -->

<div
    id="kritikaWallpaper">
</div>


<!-- =========================================================
     PROGRESS
========================================================= -->

<div id="progress"></div>


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="nav">

    <div class="brand">
        🌷
